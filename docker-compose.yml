version: "3.8"

services:
  rag-api:
    build: .
    container_name: rag-document-assistant
    ports:
      - "8003:8003"

    env_file:
      - .env

    volumes:
      - ./data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
